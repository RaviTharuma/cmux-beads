name: restore-lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate complete Cargo.lock and self-delete
        run: |
          set -euo pipefail
          bytes=$(wc -c < Cargo.lock)
          if [ "$bytes" -ge 40000 ] && grep -q 'name = "zmij"' Cargo.lock && grep -q 'name = "wit-bindgen"' Cargo.lock; then
            echo "lockfile already complete ($bytes bytes)"
          else
            rm -f Cargo.lock
            cargo generate-lockfile
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if [ -f .github/workflows/restore-lockfile.yml ]; then
            git rm -f .github/workflows/restore-lockfile.yml
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Restore full Cargo.lock"
            git push
          fi
